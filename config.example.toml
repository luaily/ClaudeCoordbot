# Your PERSONAL coordbot settings: ~/.coordbot/config.toml (`coordbot setup` creates it).
# Lines starting with # are comments. Keep the quotes around text values.
# NEVER share this file, commit it, or post it anywhere: it contains your bot's secret token.
#
# Projects that use coordbot carry a shared .coordbot/team.toml with the channel and the
# list of trusted bots. Inside such a project those settings are used automatically,
# so here you normally only need bot_token and agent_name.

# The secret token of YOUR bot (Discord Developer Portal -> your app -> Bot -> Reset Token).
bot_token = "PASTE_YOUR_BOT_TOKEN_HERE"

# The number id of the Discord channel where everybody coordinates.
# (Discord -> Settings -> Advanced -> Developer Mode ON, then right-click the channel -> Copy Channel ID.)
# No quotes around the number. Leave it 0 if your projects have a .coordbot/team.toml.
channel_id = 0

# The name shown in your posts, e.g. "alice-agent". Letters, digits, - _ . only.
agent_name = "my-agent"

# Discord user ids of the OTHER people's bots (and optionally the humans) you trust.
# Messages from anyone not in this list are ignored completely.
# Example: trusted_user_ids = [111111111111111111, 222222222222222222]
trusted_user_ids = []

# Ids of the webhooks allowed to post GitHub commits into the channel.
# It is the first number in the webhook's URL: https://discord.com/api/webhooks/<THIS NUMBER>/<secret>
# (see README step 8). Example: trusted_webhook_ids = [333333333333333333]
trusted_webhook_ids = []

# Where the local database file is kept. A relative path is relative to this config file.
# Leave it commented out: inside a project the database is ~/.coordbot/<project>-<channel>.db
# db_path = "coordbot.db"

# How many minutes a file lock lasts if you don't say otherwise.
# Locks expire by themselves so a crashed agent can't block others forever.
default_lock_ttl_minutes = 120

# Optional: a little status text your bot shows in Discord (like "Stacking bricks")
# while the bot is running. It picks one at random from this list.
# Keep the quotes around each text, separate them with commas.
# An empty list (statuses = []) means no status. Up to 100 entries, 128 characters each.
statuses = [
  "Stacking bricks",
  "Guarding file locks",
  "Reading commits",
  "Passing notes between agents",
  "Keeping the peace",
  "Checking who edits what",
  "Sorting out merge plans",
  "Watching the channel",
  "Counting open locks",
  "Taking turns nicely",
]

# How often (in minutes) the bot picks a new random status.
# 0 = pick one once when the bot starts and keep it. Maximum 1440 (one day).
status_minutes = 15

# The bot goes offline after this many minutes with no activity (nobody posting,
# no commands from your agent). It comes back by itself on your agent's next command.
# 0 = never go offline. Maximum 1440.
idle_minutes = 10

# `coordbot link` links your Discord account to your agent with a browser login that comes back
# to http://127.0.0.1:<oauth_port>/callback. Register exactly that address on your bot's
# Developer Portal page: OAuth2 -> Redirects. Change the port only if 53682 is taken.
oauth_port = 53682

# Usually not needed (the login uses PKCE). Only if `coordbot link` says Discord refused the
# login code: paste OAuth2 -> Client Secret here. It is a secret, like the token.
# client_secret = ""
