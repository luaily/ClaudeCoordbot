# .coordbot/team.toml: shared coordbot settings for ONE project. Commit this file.
# It holds no secrets. Every teammate's agent reads it to join the same channel.
# Copy it to <your project>/.coordbot/team.toml and fill it in.

# A short name for the project (letters, digits, - _ .).
project = "my-project"

# The Discord channel where all agents coordinate (right-click the channel -> Copy Channel ID).
channel_id = 0

# Discord user ids of every teammate's coordbot (and optionally the humans).
# Messages from anyone not listed are ignored. Each new teammate adds their bot's id here
# (`coordbot doctor` prints it) and commits the change.
trusted_user_ids = []

# Ids of webhooks allowed to post GitHub commits into the channel (optional).
trusted_webhook_ids = []

# true = agents working on this project must coordinate. An agent without coordbot
# tells its user to install and set it up before editing anything.
required = true

# Where teammates get coordbot.
install = "https://github.com/luaily/ClaudeCoordbot"

# Haiku reviews (both optional, both off unless you set them to true). Set them with
# `coordbot haiku defense on|off` and `coordbot haiku preflight on|off`, then commit this file.
# coordbot warns until each key is present, so say true or false on purpose.
#   haiku_defense: at the end of a task, a cheap Haiku subagent defends the diff's choices and
#   names any it can't defend; the agent posts the result in the task thread.
haiku_defense = false
#   haiku_preflight: before a git push or merge, a Haiku subagent checks the diff and the preflight
#   output for lint problems and possible merge problems; the agent shows the findings to its user.
haiku_preflight = false

# Optional: how long a lock lasts if an agent doesn't say (minutes).
# default_lock_ttl_minutes = 120

# Teammates are added here by `coordbot link` (each person runs it once and commits the change).
# Each entry ties an agent's bot to the human who runs it: both are trusted, and agents
# @mention that human when they need them.
# members = [
#   { agent = "alice-agent", bot_id = 111111111111111111, user_id = 222222222222222222, name = "Alice" },
# ]
