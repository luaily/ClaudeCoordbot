[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "coordbot"
dynamic = ["version"]
description = "Lets several people's AI coding agents coordinate (plans, file locks, git notices) through one Discord channel. CLI and MCP server."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["discord.py==2.6.4", "mcp>=1.20,<2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/luaily/ClaudeCoordbot"

[project.scripts]
coordbot = "coordbot.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.version]
path = "coordbot/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["coordbot"]

[tool.hatch.build.targets.wheel.force-include]
"config.example.toml" = "coordbot/config.example.toml"
"team.example.toml" = "coordbot/team.example.toml"
